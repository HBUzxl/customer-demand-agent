              - generic [ref=e289]: "用户输入：官网被挂马，要过等保三级。 这是一个真实客户需求。挂马 = 网站被植入恶意代码（网页篡改/WebShell/挂马），需要： 1. 挂马防护/清理 - 雷池 WAF 防护 Web 攻击（挂马往往通过 SQL注入、XSS、漏洞上传 WebShell 导致），牧云查杀主机 Webshell/后门/文件完整性监控 2. 等保三级 - 需要完整方案：雷池（边界防护）、洞鉴（漏洞扫描）、牧云（主机安全/恶意代码防范）、谛听（入侵防范）、万象（安全管理中心/日志审计） 需求理解：客户网站被挂马（网页被植入恶意代码），同时要过等保三级测评。挂马根因通常是 Web 漏洞（SQL注入、上传漏洞等）被利用植入 Webshell，或服务器被入侵。 产品匹配： - 雷池：直接防护挂马入口（Web 攻击、虚拟补丁），置信度 0.9+ - 牧云：主机端查杀 Webshell、后门，文件完整性监控发现篡改，等保恶意代码防范，置信度 0.9+ - 洞鉴：漏洞扫描找出挂马根因漏洞，等保漏洞扫描报告，置信度 0.85 - 谛听：等保三级入侵防范，流量检测，置信度 0.8 - 万象：等保三级安全管理中心/日志审计，置信度 0.8 可行性：direct（直接覆盖）。 缺失信息： - 客户名称/行业 - 网站规模、服务器数量（几台主机、是否有多个站点） - 挂马具体表现（是首页被篡改？还是被植入后门？还是被黑链？） - 等保三级测评范围（只有官网一个系统，还是整个网络？） - 是否已有 WAF/防护设备 - 预算区间 - 部署环境（公有云/私有化/信创） 这是本会话第一条消息，涉及具体客户需求，但还没有绑定客户。按流程应该先 memory_list(customer) 看已有客户，再 ask_user 问是谁家客户。我已经列了 customer，只有一个\"某跨境电商平台\"。但用户没说这是谁家客户。 我应该：先提交分析，然后询问客户是谁。按规则，\"对话开始涉及具体客户的需求/场景，且本会话还没绑定客户 → 先 memory_list(customer) 看已有客户，再 ask_user 问「这是谁家客户」\"。 我已经做了 memory_list。现在应该 ask_user 问是谁家客户。但也可以先做完整分析（analysis_submit），然后 ask_user 询问。 其实规则说真实需求要完整分析 + analysis_submit + 自然语言总结 + ask_user 收尾征询意见。 让我组织： 1. 提交 analysis_submit（结构化） 2. 自然语言总结给销售 3. ask_user 问客户身份（绑定客户）+ 追问缺失信息 实际上 ask_user 一次只能问一个问题。我优先问\"这是谁家客户\"（需要绑定客户），选项=已有客户+新客户。 但也可以把追问放在总结里，然后用 ask_user 收尾。ask_user 的问题应该是关键问题。这里最关键的是绑定客户身份。 我先做分析，然后 ask_user 问客户身份。 让我写 analysis_submit： demand_analysis：客户官网被挂马（网页被植入恶意代码），需要应急处置 + 根因排查 + 防护，同时该业务系统要通过等保三级测评。 挂马通常意味着：Web 应用存在漏洞（SQL注入/文件上传/XSS等）被利用上传了 Webshell 或植入黑链/恶意脚本；也可能服务器被直接入侵。所以安全需求是： 1. 挂马清除与根因定位（Webshell 查杀、文件篡改检测、漏洞定位） 2. Web 边界防护防止再次被挂马（WAF） 3. 等保三级合规建设（边界防护、入侵防范、恶意代码防范、漏洞扫描、日志审计≥6月、安全管理中心） matched_products： - 雷池（0.9）Web 边界防护，防挂马入口 - 牧云（0.9）主机 Webshell 查杀、文件完整性监控、恶意代码防范（等保） - 洞鉴（0.85）漏洞扫描定位挂马根因 + 等保漏洞扫描报告 - 谛听（0.8）等保入侵防范/内网横向移动检测 - 万象（0.8）等保三级安全管理中心/集中日志审计 feasibility: direct feasibility_detail：长亭全产品线可完整覆盖挂马处置+等保三级建设，无需外部整合；挂马根因若为第三方 CMS 0day 可能需配合厂商补丁，但防护层可先行阻断。 missing_info： - 客户名称/行业（便于绑定画像） - 挂马具体情况（首页篡改/黑链/Webshell 后门） - 等保三级测评范围（仅官网还是整网系统） - 服务器数量与部署环境（公有云/私有化/信创） - 是否已有 WAF/防护设备 - 预算区间与时间节点（等保测评时间） 然后自然语言总结 + ask_user。 ask_user 问谁家客户，选项：某跨境电商平台（已有）+ 新客户（带 input）。 好，组织语言。"
