            - generic [ref=e333]:
              - generic [ref=e334]:
                - heading "需求理解" [level=4] [ref=e335]
                - paragraph [ref=e337]: 客户官网被挂马（网页被植入恶意代码，常见为 webshell、篡改跳转、博彩/色情暗链或挖矿脚本），且需要通过等保三级测评。翻译为三层安全需求：①应急处置——定位并清理已植入的恶意文件/webshell（主机侧恶意代码防范）；②防护加固——在官网前端布防，阻止 SQL 注入、文件上传、XSS 等被利用的漏洞入口，避免再次被入侵（Web 边界防护/入侵防范）；③合规建设——等保三级要求的安全通信网络、入侵防范、恶意代码防范、集中日志审计（≥6月）、安全管理中心、漏洞管理等控制项需有对应产品支撑并出报告。
              - generic [ref=e338]:
                - heading "可行性判定" [level=4] [ref=e339]
                - generic [ref=e340]:
                  - generic [ref=e341]: 直接覆盖
                  - generic [ref=e342]: 挂马清理（牧云恶意文件检测与处置）+ 漏洞入口定位（洞鉴 Web/主机漏洞扫描）+ 官网防护（雷池 WAF）形成"发现—清理—防护"闭环，且雷池/洞鉴/牧云/万象/谛听共同构成等保三级标准建设组合，长亭产品线可直接覆盖，无需定制或外部整合。
              - generic [ref=e343]:
                - heading "匹配产品（5）" [level=4] [ref=e344]
                - generic [ref=e345]:
                  - generic [ref=e346]:
                    - generic [ref=e347]: 雷池
                    - generic [ref=e348]: 95%
                  - generic [ref=e351]: 官网挂马通常源于 Web 应用漏洞被利用（SQL注入/文件上传/XSS/组件漏洞）。雷池反向代理部署在官网前端，语义分析拦截注入与 XSS、虚拟补丁堵漏洞、防扫描爬虫，直接阻断再次入侵路径，同时是等保三级边界防护与入侵防范的核心控制项。
                  - generic [ref=e352]: » 官网先接雷池 WAF 兜底，防住正在发生的扫描和注入；若页面已被篡改，配合牧云先清马。
                - generic [ref=e353]:
                  - generic [ref=e354]:
                    - generic [ref=e355]: 牧云-主机安全
                    - generic [ref=e356]: 90%
                  - generic [ref=e359]: 挂马的本质是服务器上被写入了恶意文件/webshell。牧云 Agent 采集，具备恶意文件检测、异常行为检测与主机处置（文件处置/进程审计），可定位并清理已植入的挂马文件，覆盖等保三级恶意代码防范要求。
                  - generic [ref=e360]: » 服务器装牧云 Agent，先做全盘恶意文件扫描清马，再持续监控异常进程/命令，防 webshell 复活。
                - generic [ref=e361]:
                  - generic [ref=e362]:
                    - generic [ref=e363]: 洞鉴
                    - generic [ref=e364]: 90%
                  - generic [ref=e367]: 需要找出挂马被利用的漏洞入口。洞鉴覆盖 Web+主机漏洞扫描（SQL注入/XSS/越权/弱口令/CVE），可定位官网被攻破的漏洞点，同时输出等保三级测评所需的漏洞扫描报告。
                  - generic [ref=e368]: » 对官网域名和内网主机跑一轮洞鉴扫描，定位漏洞入口并出报告，作为等保漏洞管理项证据。
                - generic [ref=e369]:
                  - generic [ref=e370]:
                    - generic [ref=e371]: 万象
                    - generic [ref=e372]: 80%
                  - generic [ref=e375]: 等保三级要求集中日志审计留存≥6月与安全管理中心（集中管控/态势感知）。万象 SOC 汇聚多源日志做关联分析、威胁研判与工单流转，明确支撑等保三级安全管理中心与日志审计项。
                  - generic [ref=e376]: » 如需补齐等保日志审计与安全管理中心项，推荐万象统一收口雷池/牧云/洞鉴日志，满足6个月留存。
                - generic [ref=e377]:
                  - generic [ref=e378]:
                    - generic [ref=e379]: 谛听
                    - generic [ref=e380]: 70%
                  - generic [ref=e383]: 等保三级入侵防范要求 IDS/NDR 类检测能力。谛听旁路镜像分析流量，发现入侵、横向移动与数据外传，可作等保入侵防范的补充控制项。
                  - generic [ref=e384]: » 若客户等保整改方案明确要求 NDR 入侵防范，可加谛听旁路部署；否则雷池+牧云已覆盖大部分入侵防范项。
              - generic [ref=e385]:
                - heading "待追问" [level=4] [ref=e386]
                - list [ref=e387]:
                  - listitem [ref=e388]: 挂马的具体表现与发现方式：页面被篡改/跳转博彩色情/植入暗链/挖矿脚本/被第三方安全平台告警？决定应急清理与防护的优先级
                  - listitem [ref=e389]: 官网部署环境：云服务器/本地IDC/容器，Web 服务类型（Nginx/Apache/IIS/中间件）？是否有服务器 root 权限可装 Agent
                  - listitem [ref=e390]: 现状已有安全设备：是否已有 WAF、主机安全、日志审计/堡垒机，等保是新建建设还是存量补齐
                  - listitem [ref=e391]: 等保三级测评时间节点与责任方：测评机构是否已定，需要厂商出具哪些报告/资质
                  - listitem [ref=e392]: 资产规模与预算区间：涉及多少台服务器、几个域名，预算与采购周期
