# 客户需求分析智能体 — CI
# 后端 Go（build/vet/test）+ 前端 React/Vite（typecheck/build）+ 安全审计
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download deps
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet (gate)
        run: go vet ./...

      - name: Test (gate)
        run: go test -race -count=1 ./...

      - name: golangci-lint (gate)
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.12.2
          args: --timeout=5m

      - name: govulncheck (gate)
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod

  frontend:
    name: React frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check (gate)
        run: npx tsc --noEmit

      - name: Lint (gate)
        run: npm run lint

      - name: Format check (gate)
        run: npm run format:check

      - name: Build (gate)
        run: npm run build

      # 非阻塞：基线 4 个依赖漏洞（vite→esbuild / react-router），需用户决策升级
      - name: npm audit (informational)
        run: npm audit --omit=dev=false || true
